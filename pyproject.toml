# Settings for the development tools. The app itself isn't installed as a
# package: see the README for how to run it.

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache folder in the repo -- nothing here uses it.
addopts = "-p no:cacheprovider"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Listed rather than left to ruff's defaults, which change between versions:
# syntax and statement errors (E4, E7, E9), undefined or unused names (F),
# and import order (I). There's no ruff format: the code's hand-aligned
# tables (like the romaji chart in data/japanese/answers.py) would be lost.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
# Keeps `from x import a as b, c as d` as one import, not one per name.
combine-as-imports = true
# The tests' shared helpers, imported as a plain module from tests/.
known-local-folder = ["conftest"]
