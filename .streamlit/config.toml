# Palette + font sourced directly from https://prescript.neocities.org/ (the
# actual "The Prescripts" site) and Images/The_Index_Logo.webp:
# - style.css confirms the real font is Galmuri14 (Galmuri7 for small text) --
#   an open-source (OFL-1.1) Korean bitmap font family based on Nintendo DS
#   fonts, not Comic Sans MS as first (wrongly) guessed from a screenshot.
# - Colors, measured from style.css directly: pure black background, off-white
#   body text (#f0f8ff).
# Sampled/verified 2026-09-16.
#
# Buttons/links/input borders use the public look's periwinkle, sampled from
# the forget-me-not logo (static/forget_me_not.png) -- #7578b2 on dark, and a
# deeper #6b6ead on light, where the petal color itself is too faint to read
# on white. The original author's own copy swaps these for its sky blue
# (#96c4ec, from style.css) at launch -- see PRIVATE_LOOK in desktop_app.py.

[server]
enableStaticServing = true

[client]
# No Deploy button or developer menu items (rerun, clear cache) -- this is a
# personal app, not one being published. The Settings menu stays, so the
# public look can still be switched between light and dark.
toolbarMode = "viewer"

[theme]
font = "Galmuri14, Helvetica, sans-serif"

[[theme.fontFaces]]
family = "Galmuri14"
url = "app/static/Galmuri14.woff2"
weight = "400"
style = "normal"

[[theme.fontFaces]]
family = "Galmuri7"
url = "app/static/Galmuri7.woff2"
weight = "400"
style = "normal"

[theme.light]
primaryColor = "#6b6ead"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#e5f3ff"
textColor = "#162a3b"
linkColor = "#6b6ead"

[theme.dark]
primaryColor = "#7578b2"
backgroundColor = "#000000"
secondaryBackgroundColor = "#111318"
textColor = "#f0f8ff"
borderColor = "#2a2f3a"
codeBackgroundColor = "#0a0a0d"
linkColor = "#7578b2"
