# Runs the test suite on every push, on all three systems the README covers,
# plus the lint check. Windows is the main target; Mac and Linux check the
# browser-only path. (GitHub's Mac and Linux machines have PowerShell, so
# the PowerShell-script tests run there too.)
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Just ruff, at the version pinned in requirements-dev.txt.
      - run: python -m pip install "$(grep '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format=github .
